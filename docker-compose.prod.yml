services:
  sqlserver-prod:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: planoria-sqlserver-prod
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "${SA_PASSWORD}"
    ports:
      - "1435:1433"
    volumes:
      - sqlserver-prod-data:/var/opt/mssql
    networks:
      - planoria-network

  backend:
    build: .
    container_name: planoria-backend
    ports:
      - "7075:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - Gemini__ApiKey=${GEMINI_API_KEY}
      - Jwt__Key=${JWT_KEY}
      - Authentication__Google__ClientId=${GOOGLE_CLIENT_ID}
      - Authentication__Google__ClientSecret=${GOOGLE_CLIENT_SECRET}
      - ConnectionStrings__DefaultConnection=Server=${DB_HOST};Database=${DB_NAME};User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;
    depends_on:
      - sqlserver-prod
    networks:
      - planoria-network

volumes:
  sqlserver-prod-data:

networks:
  planoria-network:
